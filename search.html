<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Поиск — ЭПиО 6303</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
  <script>try{var t=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
</head>
<body>
  <main class="page">
    <div class="page-head fade-in">
      <h1>Поиск</h1>
      <p>По названиям лекций, предметам и преподавателям</p>
    </div>

    <form class="search-box" role="search" onsubmit="return false">
      <label class="sr-only" for="q">Что ищем?</label>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="search-input" id="q" type="search" placeholder="Например, «источники права»" autocomplete="off" enterkeyhint="search">
      <button class="icon-btn search-clear" id="clear" type="button" aria-label="Очистить" hidden>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </form>

    <div id="hints" class="search-hints"></div>
    <div id="results" aria-live="polite"></div>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/search.js"></script>
</body>
</html>
