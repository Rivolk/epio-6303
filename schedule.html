<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Расписание — ЭПиО 6303</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
  <script>try{var t=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
</head>
<body>
  <main class="page">
    <div class="page-head fade-in">
      <h1>Расписание</h1>
      <p id="week-range">&nbsp;</p>
    </div>

    <div class="toolbar">
      <div class="segmented" role="group" aria-label="Какую неделю показать">
        <button type="button" data-week="prev" aria-pressed="false">Прошлая</button>
        <button type="button" data-week="current" aria-pressed="true">Текущая</button>
      </div>
      <select id="archive-select" class="select" aria-label="Архив недель" hidden></select>
    </div>

    <div id="notice"></div>
    <div class="day-tabs" id="day-tabs" role="tablist" aria-label="Дни недели"></div>
    <div class="week" id="week"></div>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/schedule.js"></script>
</body>
</html>
